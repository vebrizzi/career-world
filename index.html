<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<!-- @UI_TEXTS.meta.page_title -->
<title>Career World · alpha 1.0.35</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090f;--surface:#111120;--surface2:#191930;
  --border:#2a2a4a;--border2:#3a3a6a;
  --text:#e8e8f8;--muted:#6868a8;
  --accent:#7c6af7;--accent2:#f76a9a;--accent3:#6af7c8;
  --warn:#f7c46a;--danger:#f76a6a;
  --cSKILL:#4fc3f7;--cVOICE:#f06292;--cCLARITY:#aed581;
  --cNETWORK:#ffb74d;--cENERGY:#4db6ac;--cRADAR:#ce93d8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:none}
/* touch-action:none di default serve al canvas di gioco (blocca pinch-zoom
   /bounce durante il movimento) — ma un browser combina touch-action per
   INTERSEZIONE lungo tutta la catena di antenati: un .scr discendente non
   può "riabilitare" lo scroll touch da solo (impostarlo lì non ha alcun
   effetto pratico), va cambiato qui sul body. body.scrollable si applica a
   ogni schermata tranne il gioco (vedi show() in game.js) — senza, lo
   scroll con overflow-y:auto funziona col mouse ma non con lo swipe reale
   su mobile, rendendo irraggiungibile ciò che sta sotto la piega su
   schermate più alte dello schermo (es. #s-map, #s-assess). */
body.scrollable{touch-action:pan-y}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;z-index:9000}
#gc{width:100vw;height:100vh;overflow:hidden;position:relative}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;transform:translateY(14px);transition:opacity .35s,transform .35s;pointer-events:none}
.scr.on{opacity:1;transform:none;pointer-events:all}

/* ── TITLE ── */
#s-title{background:radial-gradient(ellipse at 50% 40%,#1a1040 0%,var(--bg) 70%);gap:2rem;text-align:center}
.t-pixel{font-family:'Press Start 2P',monospace;font-size:clamp(1.4rem,4.5vw,2.8rem);color:var(--accent);text-shadow:0 0 30px rgba(124,106,247,.6);line-height:1.5;animation:tpulse 3s ease-in-out infinite}
@keyframes tpulse{0%,100%{text-shadow:0 0 30px rgba(124,106,247,.6)}50%{text-shadow:0 0 60px rgba(124,106,247,.9),0 0 100px rgba(247,106,154,.3)}}
.t-sub{font-family:'Space Mono',monospace;font-size:.78rem;color:var(--muted);letter-spacing:.1em}
.t-desc{max-width:460px;font-size:.88rem;line-height:1.75;color:var(--muted)}
.t-desc strong{color:var(--accent3)}
.btn-start{font-family:'Press Start 2P',monospace;font-size:.68rem;padding:1rem 2.2rem;background:transparent;border:2px solid var(--accent);color:var(--accent);cursor:pointer;letter-spacing:.1em;transition:all .2s;position:relative;overflow:hidden}
.btn-start::before{content:'';position:absolute;inset:0;background:var(--accent);transform:translateX(-100%);transition:transform .25s;z-index:-1}
.btn-start:hover{color:var(--bg)}.btn-start:hover::before{transform:translateX(0)}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sd{position:absolute;border-radius:50%;background:white;animation:twink var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes twink{0%,100%{opacity:.1}50%{opacity:.7}}

/* ── ASSESS ── */
#s-assess{padding:0;align-items:stretch;justify-content:flex-start}
.a-layout{display:grid;grid-template-columns:230px 1fr;height:100vh;width:100%}
/* Calibrazione iniziale account autenticato (solo Fase 3, vedi
   startFreshAuthenticated() in game.js): niente sidebar a 3 step, ne salta 2. */
body.calibration-mode .a-layout{grid-template-columns:1fr}
body.calibration-mode .a-side{display:none}
@media(max-width:640px){
  .a-layout{grid-template-columns:1fr;height:100vh;}
  .a-side{display:none}
  .a-main{padding:1rem;}
  .a-footer{padding:.8rem 1rem 1.5rem;}
  .a-title{font-size:1.1rem}
  .a-sub{font-size:.78rem}
  .bq-q{font-size:.78rem}
  .bq-opt{font-size:.68rem;padding:.28rem .55rem}
}
.a-side{background:var(--surface);border-right:1px solid var(--border);padding:2rem 1.25rem;display:flex;flex-direction:column;gap:.8rem;overflow-y:auto}
.a-side-title{font-family:'Space Mono',monospace;font-size:.52rem;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-bottom:.2rem}
.a-step{display:flex;align-items:center;gap:.6rem;padding:.5rem .65rem;border-radius:8px;font-size:.78rem;color:var(--muted);transition:all .2s}
.a-step.active{background:rgba(124,106,247,.15);color:var(--accent)}
.a-step.done{color:var(--accent3)}
.a-step .snum{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:.48rem;flex-shrink:0}
.a-step.done .snum{background:var(--accent3);border-color:var(--accent3);color:var(--bg)}
.a-side-note{margin-top:auto;font-size:.68rem;color:var(--muted);line-height:1.6;padding-top:1rem;border-top:1px solid var(--border)}
.a-main{padding:2.5rem;overflow-y:auto;display:flex;flex-direction:column;gap:1.3rem;flex:1;min-height:0;}
@media(max-width:800px) and (min-width:641px){.a-main{padding:1.25rem}}
.a-tag{font-family:'Space Mono',monospace;font-size:.52rem;color:var(--accent);letter-spacing:.15em;text-transform:uppercase}
.a-title{font-size:1.4rem;font-weight:700;line-height:1.3}
.a-sub{font-size:.85rem;color:var(--muted);line-height:1.65;max-width:580px}
.prog{height:3px;background:var(--border);border-radius:2px;overflow:hidden;max-width:500px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.bq-list{display:flex;flex-direction:column;gap:.65rem;max-width:620px}
.bq-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem 1.05rem;transition:border-color .2s}
.bq-item:hover{border-color:var(--border2)}
.bq-q{font-size:.83rem;font-weight:500;margin-bottom:.6rem;line-height:1.5}
.bq-opts{display:flex;gap:.38rem;flex-wrap:wrap}
.bq-opt{font-size:.73rem;padding:.32rem .7rem;border:1.5px solid var(--border);border-radius:20px;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .15s}
.bq-opt:hover{border-color:var(--accent);color:var(--accent)}
.bq-opt.sel{background:rgba(124,106,247,.2);border-color:var(--accent);color:var(--text)}
.sl-list{display:flex;flex-direction:column;gap:1rem;max-width:580px}
.sl-item{display:flex;flex-direction:column;gap:.5rem}
.sl-label{font-size:.83rem;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sl-tag{font-family:'Space Mono',monospace;font-size:.52rem;color:var(--accent);background:rgba(124,106,247,.15);padding:.18rem .45rem;border-radius:4px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(124,106,247,.5);cursor:pointer}
.sl-ends{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted)}
.a-footer{display:flex;align-items:center;justify-content:space-between;padding:.8rem 2.5rem 1.5rem;border-top:1px solid var(--border);gap:1rem;flex-shrink:0}
.a-note{font-size:.7rem;color:var(--muted);font-style:italic;line-height:1.5;max-width:300px}
.btn-next{font-family:'Space Mono',monospace;font-size:.63rem;padding:.72rem 1.55rem;background:var(--accent);border:none;border-radius:8px;color:white;cursor:pointer;letter-spacing:.05em;transition:all .2s;white-space:nowrap;flex-shrink:0}
.btn-next:hover{background:#9585ff;transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,106,247,.4)}

/* ── CARD ── */
#s-card{background:radial-gradient(ellipse at 30% 50%,#1a1040 0%,var(--bg) 60%);flex-direction:row;gap:3rem;flex-wrap:wrap;justify-content:center;align-items:center}
.card-swipe-hint{display:none}
@media(max-width:600px){
  #s-card{flex-direction:column!important;padding:.75rem .75rem 2rem!important;
          align-items:stretch!important;justify-content:flex-start!important;
          overflow-y:auto!important;gap:1rem!important}
  .c-left{max-width:100%!important;width:100%!important;flex:none!important;order:2}
  .c-right{max-width:100%!important;width:100%!important;flex:none!important;order:1}
  .dnd-card{max-width:320px;margin:0 auto}
  .card-swipe-hint{display:flex;justify-content:center;align-items:center;
    gap:.4rem;padding:.75rem 0 .5rem;
    font-family:'Space Mono',monospace;font-size:.6rem;color:var(--accent3);
    animation:bouncedown 1.4s ease-in-out infinite}
}
@keyframes bouncedown{
  0%,100%{transform:translateY(0);opacity:.5}
  50%{transform:translateY(4px);opacity:1}
}
.c-left{max-width:340px;flex:1;display:flex;flex-direction:column;gap:1rem}
.c-eyebrow{font-family:'Space Mono',monospace;font-size:.52rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.c-headline{font-size:clamp(1.25rem,3vw,1.85rem);font-weight:700;line-height:1.2}
.c-headline em{color:var(--accent);font-style:normal}
.c-expl{font-size:.83rem;color:var(--muted);line-height:1.7}
.c-bias{background:rgba(106,247,200,.07);border:1px solid rgba(106,247,200,.2);border-radius:10px;padding:.85rem 1.05rem;font-size:.78rem;line-height:1.65;color:var(--accent3)}
.c-right{flex:1;max-width:310px}
.dnd-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:cdrop .6s cubic-bezier(.22,1,.36,1) both}
@keyframes cdrop{from{opacity:0;transform:translateY(-24px) scale(.96)}to{opacity:1;transform:none}}
.c-top{padding:1.3rem;text-align:center;position:relative;overflow:hidden}
.c-class-tag{font-family:'Space Mono',monospace;font-size:.5rem;letter-spacing:.12em;padding:.26rem .62rem;border-radius:4px;display:inline-block;margin-bottom:.6rem;font-weight:700}
.c-av{font-size:3rem;margin:.35rem 0}
.c-cname{font-family:'Space Mono',monospace;font-size:.9rem;margin-bottom:.18rem}
.c-csub{font-size:.73rem;color:var(--muted)}
.c-stats{padding:1rem 1.35rem;border-top:1px solid var(--border)}
.st-row{display:flex;align-items:center;gap:.52rem;margin-bottom:.42rem}
.st-row:last-child{margin-bottom:0}
.st-key{font-family:'Space Mono',monospace;font-size:.46rem;width:48px;flex-shrink:0}
.st-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.st-fill{height:100%;border-radius:3px;width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.st-num{font-family:'Space Mono',monospace;font-size:.7rem;width:22px;text-align:right;flex-shrink:0}
.c-desc{padding:.85rem 1.35rem 1rem;border-top:1px solid var(--border);font-size:.74rem;color:var(--muted);line-height:1.65}
.c-traits{display:flex;flex-wrap:wrap;gap:.28rem;margin-top:.65rem}
.c-trait{font-size:.6rem;padding:.16rem .48rem;border:1px solid;border-radius:20px;font-weight:600}

/* ── GAME ── */
#s-game{padding:0;justify-content:flex-start;background:var(--bg);height:100vh;overflow:hidden}
.g-hud{width:100%;background:var(--surface);border-bottom:1px solid var(--border);padding:.5rem 1.1rem;display:flex;align-items:center;gap:1rem;flex-shrink:0;flex-wrap:wrap;z-index:10}
.g-hud-left{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.g-hud-av{font-size:1.4rem}
.g-cls{font-family:'Space Mono',monospace;font-size:.5rem;letter-spacing:.08em;padding:.22rem .55rem;border-radius:4px;white-space:nowrap}
.g-hud-center{flex:1;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.g-world-label{font-family:'Press Start 2P',monospace;font-size:clamp(.45rem,.9vw,.65rem);color:var(--text);line-height:1.4}
.g-stats-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.g-st{display:flex;align-items:center;gap:.28rem}
.g-st-key{font-family:'Space Mono',monospace;font-size:.42rem;white-space:nowrap}
.g-segs{display:flex;gap:2px}
.g-seg{width:7px;height:7px;border-radius:1px;border:1px solid rgba(255,255,255,.08);transition:background .3s}
@media(max-width:600px){
  .g-hud{padding:.3rem .65rem;gap:.5rem}
  .g-world-label{font-size:.4rem}
  .g-seg{width:5px;height:6px}
  /* Sotto i 600px g-hud-left + progress-panel (min-width 120px) + il
     bottone job-change insieme non ci stanno più su una riga sola: senza
     questa regola g-hud-center (l'unico figlio che può restringersi, via
     min-width:0) veniva schiacciato a una fessura larga pochi px invece di
     andare a capo, con mondo/statistiche illeggibili incollati a destra. */
  .g-hud-center{flex-basis:100%}
  .progress-panel{min-width:0}
}
.g-area{flex:1;position:relative;overflow:hidden;width:100%;min-height:200px;display:flex;flex-direction:column;justify-content:center}
.g-area canvas{display:block;width:100%;image-rendering:pixelated;flex-shrink:0}
.g-msg{position:absolute;bottom:0;left:0;right:0;background:rgba(9,9,15,.92);border-top:1px solid var(--border);padding:.5rem 1.1rem;font-family:'Space Mono',monospace;font-size:.62rem;color:var(--accent3);min-height:38px;display:flex;align-items:center;z-index:20}

#tc{display:none;pointer-events:none}
@media(hover:none),(max-width:600px){
  #tc{display:flex;justify-content:space-between;align-items:center;
      position:fixed;bottom:0;left:0;right:0;z-index:200;
      background:rgba(9,9,15,.97);border-top:1px solid var(--border);
      padding:.4rem .8rem calc(.4rem + env(safe-area-inset-bottom,.3rem));
      pointer-events:all}
  .g-msg{display:none}
  #s-game{padding-bottom:80px}
  .dl-ov{bottom:0;z-index:300;overflow-y:auto}
  .dl-box{max-height:calc(100dvh - 80px);max-height:calc(100vh - 80px);margin-bottom:80px}
}
.tc-l{display:flex;gap:.4rem;pointer-events:all}
.tc-r{pointer-events:all}
.tc-btn{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.45);color:rgba(255,255,255,.7);font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;transition:background .1s,border-color .1s}
.tc-btn.pressed{background:rgba(124,106,247,.45);border-color:rgba(124,106,247,.8)}
.tc-jump{width:60px;height:60px;background:rgba(106,247,200,.12);border-color:rgba(106,247,200,.35);font-size:1.4rem}
.tc-jump.pressed{background:rgba(106,247,200,.4)}

/* dialog */
.dl-ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;padding:.75rem;z-index:300;animation:fadein .2s;overflow-y:auto}
@keyframes fadein{from{opacity:0}}
.dl-box{width:100%;max-width:640px;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:1.3rem;box-shadow:0 0 40px rgba(124,106,247,.18);animation:slideup .25s cubic-bezier(.22,1,.36,1);max-height:80vh;overflow-y:auto;box-sizing:border-box}
@keyframes slideup{from{transform:translateY(18px);opacity:0}}
@media(max-width:640px){
  .dl-ov{align-items:flex-start;padding:.5rem;padding-top:max(.5rem,env(safe-area-inset-top))}
  .dl-box{max-height:80vh;border-radius:10px;padding:.9rem}
  .dl-txt{font-size:.82rem;line-height:1.6}
  .ch-btn{font-size:.76rem;padding:.52rem .7rem}
}
.dl-box.critic{border-color:var(--danger);box-shadow:0 0 40px rgba(247,106,106,.15)}
.dl-box.sister{border-color:#e53935;box-shadow:0 0 40px rgba(229,57,53,.18)}
.dl-box.tech{border-color:var(--warn);box-shadow:0 0 40px rgba(247,196,106,.15)}
.dl-box.debrief{border-color:var(--accent3);max-height:72vh;overflow-y:auto}
.dl-spk{font-family:'Space Mono',monospace;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.42rem}
.dl-txt{font-size:.9rem;line-height:1.65;margin-bottom:1rem;color:var(--text)}
.dl-choices{display:flex;flex-direction:column;gap:.42rem}
.ch-btn{font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;padding:.62rem .9rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;text-align:left;transition:all .15s}
.ch-btn:hover{border-color:var(--accent);background:rgba(124,106,247,.1)}
.db-sec{margin-bottom:.85rem}
.db-rows{display:flex;flex-direction:column;gap:.3rem;margin-top:.3rem}
.wd-insight{border-radius:0 6px 6px 0;margin-bottom:.3rem;transition:all .3s}
.wd-insight-new{animation:fadein .4s ease both}
.db-row{display:flex;gap:.5rem;align-items:flex-start;font-size:.72rem;line-height:1.5}
.db-tag{color:#6af7c8;flex-shrink:0;font-weight:bold}
.db-lbl{font-family:'Space Mono',monospace;font-size:.5rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.28rem}
.db-ins{background:rgba(106,247,200,.07);border-left:3px solid var(--accent3);padding:.58rem .75rem;font-size:.78rem;line-height:1.6;border-radius:0 6px 6px 0}
.db-data{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--warn);margin-top:.32rem}
.st-pills{display:flex;gap:.38rem;flex-wrap:wrap;margin-top:.42rem}
.st-pill{font-family:'Space Mono',monospace;font-size:.56rem;padding:.2rem .52rem;border-radius:20px;border:1px solid}

/* world transition */
.wt-overlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1rem;z-index:100;overflow-y:auto;padding:1.5rem}
.wt-overlay>*{flex-shrink:0}
@media(min-height:700px){.wt-overlay>div:first-child{margin-top:auto} .wt-overlay>div:last-child{margin-bottom:auto}}
.wt-title{font-family:'Press Start 2P',monospace;font-size:clamp(.7rem,2vw,1.1rem);color:var(--accent3);text-align:center;line-height:1.8}
.wt-sub{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center}
.wt-progress{width:200px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:.5rem}
.wt-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent3));animation:wtfill 2s ease forwards}
@keyframes wtfill{from{width:0}to{width:100%}}

/* OUTCOME */
#s-outcome{background:radial-gradient(ellipse at 50% 60%,#0a1a10 0%,var(--bg) 70%);gap:1.5rem;text-align:center}
.oc-em{font-size:3rem}
.oc-title{font-family:'Press Start 2P',monospace;font-size:clamp(.6rem,1.8vw,1rem);color:var(--accent3);line-height:1.9}
.oc-desc{font-size:.86rem;color:var(--muted);line-height:1.7;max-width:480px}
.oc-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.3rem;text-align:left;width:100%;max-width:500px}
.oc-card-title{font-family:'Space Mono',monospace;font-size:.5rem;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.65rem}
.oc-rows{display:flex;flex-direction:column;gap:.42rem}
.oc-row{display:flex;gap:.65rem;align-items:flex-start;font-size:.78rem;line-height:1.5}
.oc-tag{font-family:'Space Mono',monospace;font-size:.5rem;padding:.16rem .42rem;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:.1rem}
.oc-take{background:rgba(124,106,247,.1);border:1px solid rgba(124,106,247,.28);border-radius:10px;padding:.9rem 1.05rem;font-size:.78rem;line-height:1.7;max-width:500px;text-align:left}
.oc-take strong{color:var(--accent)}
.btn-replay{font-family:'Space Mono',monospace;font-size:.6rem;padding:.72rem 1.7rem;background:transparent;border:1.5px solid var(--accent3);color:var(--accent3);cursor:pointer;border-radius:8px;letter-spacing:.07em;transition:all .2s}
.btn-replay:hover{background:rgba(106,247,200,.1)}

/* ── WORLD MAP ── */
/* .scr centra verticalmente con justify-content:center: se il contenuto
   (titolo + note + 6 nodi mappa) supera l'altezza dello schermo, un
   container flex centrato E scrollabile taglia simmetricamente sia l'inizio
   che la fine invece di restare scrollabile fino agli estremi — stesso bug
   già risolto per #s-game con questo stesso override (vedi sopra). */
#s-map{background:radial-gradient(ellipse at 50% 40%,#0a1428 0%,var(--bg) 70%);padding:1.5rem;overflow-y:auto;justify-content:flex-start;}
.map-wrap{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:1.25rem;align-items:center;}
.map-title{font-family:'Press Start 2P',monospace;font-size:clamp(.55rem,1.4vw,.8rem);color:var(--accent);text-align:center;line-height:1.9;}
.map-subtitle{font-family:'Space Mono',monospace;font-size:.62rem;color:var(--muted);text-align:center;}
.map-free-note{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--accent3);text-align:center;background:rgba(106,247,200,.07);border:1px solid rgba(106,247,200,.2);border-radius:8px;padding:.55rem .9rem;max-width:600px;}
/* La mappa non si rimpicciolisce mai sotto una soglia leggibile: sotto i
   560px di larghezza diventa scorrevole orizzontalmente invece di
   rimpicciolire nodi/testo — stessa filosofia "naviga invece di rimpicciolire"
   usata nelle stanze di gioco (vedi CAMERA_ZOOM in game.js). */
.map-svg-wrap{width:100%;max-width:680px;position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.map-svg-wrap svg{width:100%;min-width:560px;height:auto;overflow:visible;}
.mn-fo{overflow:visible;}
.mn-card{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .18s;}
/* Il contenuto SVG (svg/foreignObject/card) ignora di default il
   pointer-events:none ereditato da #s-map quando la mappa non è la
   schermata attiva — va quindi riabilitato SOLO quando #s-map ha .on,
   altrimenti questi nodi restano cliccabili "invisibilmente" sopra
   qualunque schermata venga mostrata dopo (es. bug: reset da zero →
   click su INIZIA finiva per riattivare un mondo tramite un mn-card
   ancora nel DOM, mai perché visibile ma perché ancora intercettava i click). */
#s-map.on .map-svg-wrap svg,
#s-map.on .mn-fo,
#s-map.on .mn-card{pointer-events:all;}
.mn-card:hover{transform:scale(1.08);}
.mn-card:hover .mn-box{filter:brightness(1.2);}
.mn-box{width:84px;height:84px;border-radius:12px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .2s;position:relative;}
.mn-emoji{font-size:1.8rem;line-height:1;}
.mn-lbl{font-family:'Press Start 2P',monospace;font-size:.32rem;text-align:center;line-height:1.5;padding:0 4px;}
.mn-status{font-family:'Space Mono',monospace;font-size:.52rem;margin-top:3px;text-align:center;}
.mn-done-badge{position:absolute;top:-7px;right:-7px;background:#6af7c8;color:#060e08;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:bold;line-height:1;}
.mn-affinities{font-family:'Space Mono',monospace;font-size:.48rem;color:var(--muted);text-align:center;max-width:84px;line-height:1.4;margin-top:2px;}

.progress-panel{display:flex;flex-direction:column;gap:.22rem;flex-shrink:0;min-width:120px;}
.pp-row{display:flex;align-items:center;gap:.35rem;font-family:'Space Mono',monospace;font-size:.44rem;}
.pp-label{min-width:18px;text-align:center;font-size:.62rem;line-height:1;}
.pp-pips{display:flex;gap:2px;align-items:center;}
.pp-pip{width:10px;height:10px;border-radius:2px;border:1px solid rgba(255,255,255,.12);flex-shrink:0;}
.pp-pip.done{border-color:transparent;}
.pp-pip.opt{width:7px;height:7px;opacity:.4;}
.pp-count{font-size:.42rem;}
.pp-status{font-family:'Press Start 2P',monospace;font-size:.35rem;text-align:center;padding:.2rem .4rem;border-radius:3px;white-space:nowrap;margin-top:.1rem;}
.pp-status.locked{color:#f7c46a;background:rgba(247,196,106,.08);border:1px solid rgba(247,196,106,.2);}
.pp-status.open{color:#6af7c8;background:rgba(106,247,200,.08);border:1px solid rgba(106,247,200,.2);}

.wi-ov{position:absolute;inset:0;background:rgba(5,5,15,.96);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:1.5rem;animation:fadein .3s;overflow-y:auto}
.wi-box{width:100%;max-width:560px;display:flex;flex-direction:column;gap:1rem;padding-bottom:1.5rem}
@media(min-height:700px){.wi-ov{align-items:center}}
.wi-emoji{font-size:3rem;text-align:center}
.wi-title{font-family:'Press Start 2P',monospace;font-size:clamp(.7rem,2vw,1.1rem);text-align:center;line-height:1.8}
.wi-what{font-size:.8rem;color:var(--muted);line-height:1.65;font-style:italic;text-align:center}
.wi-role{font-size:.82rem;line-height:1.65;color:var(--text)}
.wi-cols{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.wi-col{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.7rem .9rem}
.wi-col-title{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.4rem}
.wi-col li{font-size:.76rem;color:var(--muted);line-height:1.6;margin-left:1rem}
.wi-hint{background:rgba(106,247,200,.07);border:1px solid rgba(106,247,200,.2);border-radius:8px;padding:.65rem .9rem;font-size:.78rem;color:var(--accent3);text-align:center;line-height:1.6}
.wi-hint kbd{background:rgba(106,247,200,.15);border:1px solid rgba(106,247,200,.3);border-radius:3px;padding:.05rem .3rem;font-family:'Space Mono',monospace;font-size:.72rem}

@media(max-width:600px){.g-hud{padding:.3rem .65rem;gap:.5rem}.g-world{display:none}}
</style>
</head>
<body>
<div id="gc">

<!-- ══════════════════════════════════════
     TITLE SCREEN
     Testi: UI_TEXTS.title + UI_TEXTS.meta.version
     Popolati da applyUITexts() al DOMContentLoaded
     ══════════════════════════════════════ -->
<div id="s-title" class="scr on">
  <div class="stars" id="stars"></div>
  <div class="t-pixel" id="uiGameTitle"><!-- UI_TEXTS.title.game_title --></div>
  <div id="uiVersion" style="font-family:'Space Mono',monospace;font-size:.45rem;color:var(--muted);margin-bottom:.5rem;letter-spacing:.15em"><!-- UI_TEXTS.meta.version --></div>
  <div class="t-sub" id="uiTagline"><!-- UI_TEXTS.title.tagline --></div>
  <div class="t-desc" id="uiDescription"><!-- UI_TEXTS.title.description --></div>
  <button class="btn-start" id="btnStart"><!-- UI_TEXTS.title.btn_start --></button>
</div>

<!-- ══════════════════════════════════════
     ENTRY SCREEN — scelta guest / accedi
     Logica: src/auth/authScreen.js (initEntryScreen)
     ══════════════════════════════════════ -->
<div id="s-entry" class="scr">
  <div class="t-pixel" style="font-size:clamp(1rem,3vw,1.6rem)">ACCEDI O CONTINUA</div>
  <div class="t-desc">Accedi per salvare i tuoi progressi tra una sessione e l'altra e sbloccare interazioni extra, oppure gioca subito come guest.</div>
  <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem">
    <button class="btn-start" id="btnShowLogin">🔑 Accedi e riprendi</button>
    <button class="btn-start" id="btnGuest">👤 Gioca come guest</button>
  </div>
  <button id="btnRegister" style="margin-top:.75rem;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:.5rem 1.1rem;font-family:'Space Mono',monospace;font-size:.62rem;cursor:pointer;letter-spacing:.05em">✍️ Non hai un account? Registrati</button>

  <div id="entryAuthPanel" style="display:none;flex-direction:column;gap:.7rem;margin-top:1.5rem;max-width:300px;width:100%">
    <div style="display:flex;gap:.5rem;justify-content:center">
      <button class="btn-next" id="btnModeLogin" style="flex:1">Accedi</button>
      <button class="btn-next" id="btnModeSignup" style="flex:1;background:var(--surface2)">Registrati</button>
    </div>
    <input type="email" id="entryEmail" placeholder="Email" autocomplete="email" style="padding:.6rem .8rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit">
    <input type="password" id="entryPassword" placeholder="Password" autocomplete="current-password" style="padding:.6rem .8rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit">
    <button class="btn-next" id="btnAuthSubmit">Continua</button>
    <div id="entryAuthMsg" style="font-size:.72rem;color:var(--muted);min-height:1.2em;text-align:center"></div>
  </div>

  <div id="guestWarnOverlay" class="wi-ov" style="display:none">
    <div class="wi-box" style="text-align:center;margin:auto">
      <div class="wi-emoji">⚠️</div>
      <div class="wi-title" style="color:var(--warn)">Giocando come guest</div>
      <div class="wi-what">L'avanzamento non verrà salvato. Se chiudi o ricarichi la pagina, perderai i tuoi progressi.</div>
      <div style="display:flex;gap:1rem;justify-content:center;margin-top:1rem">
        <button class="btn-next" id="btnGuestCancel" style="background:var(--surface2)">Annulla</button>
        <button class="btn-next" id="btnGuestConfirm">Continua come guest</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     ASSESSMENT SCREEN
     Sidebar: UI_TEXTS.assess.*
     Contenuto dinamico: renderAssess() legge da STEPS[] e UI_TEXTS.assess
     ══════════════════════════════════════ -->
<div id="s-assess" class="scr">
  <div class="a-layout">
    <div class="a-side">
      <!-- UI_TEXTS.assess.sidebar_title -->
      <div class="a-side-title" id="uiAssessSidebarTitle"><!-- --></div>
      <!-- UI_TEXTS.assess.step_labels[0] -->
      <div class="a-step active" id="stp-0">
        <div class="snum">1</div>
        <div id="uiStep0Label"><!-- --></div>
      </div>
      <!-- UI_TEXTS.assess.step_labels[1] -->
      <div class="a-step" id="stp-1">
        <div class="snum">2</div>
        <div id="uiStep1Label"><!-- --></div>
      </div>
      <!-- UI_TEXTS.assess.step_labels[2] -->
      <div class="a-step" id="stp-2">
        <div class="snum">3</div>
        <div id="uiStep2Label"><!-- --></div>
      </div>
      <!-- UI_TEXTS.assess.sidebar_note -->
      <div class="a-side-note" id="uiAssessSidebarNote"><!-- --></div>
    </div>
    <div class="a-main" id="aMain"></div>
  </div>
</div>

<!-- ══════════════════════════════════════
     CARD SCREEN
     Testi fissi: UI_TEXTS.card.*
     Testi dinamici (classe, stat): renderCard() da CLASSES[]
     ══════════════════════════════════════ -->
<div id="s-card" class="scr">
  <div class="c-left">
    <!-- UI_TEXTS.card.eyebrow -->
    <div class="c-eyebrow" id="uiCardEyebrow"><!-- --></div>
    <!-- UI_TEXTS.card.headline -->
    <div class="c-headline" id="uiCardHeadline"><!-- --></div>
    <!-- UI_TEXTS.card.explanation -->
    <div class="c-expl" id="uiCardExpl"><!-- --></div>
    <!-- UI_TEXTS.card.bias_note — popolato da renderCard() -->
    <div class="c-bias" id="biasNote"></div>
    <!-- UI_TEXTS.card.btn_enter -->
    <button class="btn-next" id="btnEnterGame" style="margin-top:.5rem;align-self:flex-start"><!-- --></button>
  </div>
  <div class="c-right">
    <div class="dnd-card" id="dndCard"></div>
    <div class="card-swipe-hint" id="cardSwipeHint">
      <!-- UI_TEXTS.card.swipe_hint -->
      <span id="uiSwipeHint"><!-- --></span>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MAP SCREEN
     Contenuto 100% dinamico: renderMap() legge da UI_TEXTS.map
     ══════════════════════════════════════ -->
<div id="s-map" class="scr">
  <div class="map-wrap" id="mapWrap"></div>
</div>

<!-- ══════════════════════════════════════
     GAME SCREEN
     HUD: renderHUD() | gMsg: setMsg() | Touch: applyUITexts()
     ══════════════════════════════════════ -->
<div id="s-game" class="scr">
  <div class="g-hud" id="gHud"></div>
  <div class="g-area" id="gArea">
    <!-- UI_TEXTS.game.msg_default — aggiornato da setMsg() -->
    <div class="g-msg" id="gMsg"><!-- --></div>
    <div id="dlLayer"></div>
  </div>
  <div id="tc">
    <div class="tc-l">
      <!-- UI_TEXTS.touch.btn_* -->
      <div class="tc-btn" id="tc-left"><!-- --></div>
      <div class="tc-btn" id="tc-right"><!-- --></div>
      <div class="tc-btn" id="tc-up"><!-- --></div>
      <div class="tc-btn" id="tc-down"><!-- --></div>
    </div>
    <div class="tc-r"><div class="tc-btn tc-jump" id="tc-act"><!-- --></div></div>
  </div>
</div>

<!-- ══════════════════════════════════════
     OUTCOME SCREEN
     Contenuto 100% dinamico: renderOutcome() legge da UI_TEXTS.outcome
     ══════════════════════════════════════ -->
<div id="s-outcome" class="scr"></div>

</div><!-- /#gc -->

<script type="module" src="/src/main.js"></script>
</body>
</html>
